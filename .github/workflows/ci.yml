name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: xego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: testpass
      DATABASE_URL: "host=127.0.0.1 port=5432 user=postgres password=testpass database=xego sslmode=disable"
      TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=postgres password=testpass database=xego_test sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Create live database
        run: PGPASSWORD=testpass psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE xego;" || true

      - name: Run migrations (live DB)
        run: |
          for f in internal/store/migrations/*.sql; do
            PGPASSWORD=testpass psql -h 127.0.0.1 -U postgres -d xego -f "$f" 2>/dev/null || true
          done

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

      - name: Gosec
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
