services:
  db:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/xego-db-entrypoint.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/etc/postgresql/ssl/server.crt", "-c", "ssl_key_file=/etc/postgresql/ssl/server.key", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=/usr/local/bin/xego-archive-wal.sh %p %f"]
    environment:
      POSTGRES_DB: whatsapp_payment
      POSTGRES_USER: whatsapp_payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /var/lib/xego-backup
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db-ssl-entrypoint.sh:/usr/local/bin/xego-db-entrypoint.sh:ro
      - ./deploy/pg-archive-wal.sh:/usr/local/bin/xego-archive-wal.sh:ro
      - xego_backup:/var/lib/xego-backup
    ports:
      # Cross-host access for compose.edge.yaml (server 2 connects to this
      # PostgreSQL via PRIMARY_DB_HOST). PostgreSQL already terminates TLS
      # with the self-signed certificate deploy/db-ssl-entrypoint.sh
      # generates, so the edge uses sslmode=require (encryption-only; no
      # client cert files needed). Mandatory firewall rule: restrict
      # 5432/tcp to the peer app server's IP only. Override the published
      # port with PRIMARY_DB_PORT if 5432 is taken.
      - "${PRIMARY_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_payment -d whatsapp_payment"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks: [private]

  # PgBouncer (requirements workbook #2): transaction pooling multiplexes
  # both app replicas' connection pools (DB_MAX_CONNS each) onto
  # DEFAULT_POOL_SIZE server connections, so replicas never compete for
  # PostgreSQL max_connections slots. max_prepared_statements keeps pgx's
  # cached statements working under transaction pooling.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://whatsapp_payment:${POSTGRES_PASSWORD}@db:5432/whatsapp_payment
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "30"
      MAX_PREPARED_STATEMENTS: "100"
      AUTH_TYPE: scram-sha-256
      # Server side (PgBouncer -> PostgreSQL) keeps the TLS posture the app
      # had when it connected directly; the client side stays plain inside
      # the private compose network.
      SERVER_TLS_SSLMODE: require
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  backup:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backup
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: whatsapp_payment
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-whatsapp-payment}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RPO: ${BACKUP_RPO:-1h}
      BACKUP_RTO: ${BACKUP_RTO:-15m}
      BACKUP_DIR: /var/lib/xego-backup
      RCLONE_REMOTE: ${RCLONE_REMOTE:-xegobackup}
    volumes:
      - xego_backup:/var/lib/xego-backup
      - ${RCLONE_CONFIG:-./deploy/rclone.conf}:/etc/xego-backup/rclone.conf:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  # Long-running scheduler so backup_runs actually fills without host cron /
  # systemd: drives the WAL ship, daily base backup and weekly PITR drill on
  # an epoch-aligned tick (see deploy/schedule.sh). The one-shot `backup`
  # service above stays available for manual `docker compose run --rm backup`.
  backup-scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backup
    restart: unless-stopped
    entrypoint: ["/opt/xego-backup/schedule.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: whatsapp_payment
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-whatsapp-payment}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RPO: ${BACKUP_RPO:-1h}
      BACKUP_RTO: ${BACKUP_RTO:-15m}
      BACKUP_DIR: /var/lib/xego-backup
      RCLONE_REMOTE: ${RCLONE_REMOTE:-xegobackup}
    volumes:
      - xego_backup:/var/lib/xego-backup
      - ${RCLONE_CONFIG:-./deploy/rclone.conf}:/etc/xego-backup/rclone.conf:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  migrate:
    # Release/CD (deploy/release.sh): the app and the migrate one-shot run
    # the same published image. Unset APP_IMAGE keeps the local build
    # (xego-app:local); a release pins it to the registry tag so
    # `docker compose pull` fetches it and `up --no-build` runs it as-is.
    image: ${APP_IMAGE:-xego-app:local}
    build: .
    command: ["migrate"]
    env_file: .env
    environment:
      # Migrations run straight against PostgreSQL (not through PgBouncer):
      # the multi-statement migration files and the session-level advisory
      # lock both need a direct, session-pinned connection.
      DATABASE_URL: postgres://whatsapp_payment:${POSTGRES_PASSWORD}@db:5432/whatsapp_payment?sslmode=require
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  app:
    # Release/CD (deploy/release.sh): the app and the migrate one-shot run
    # the same published image. Unset APP_IMAGE keeps the local build
    # (xego-app:local); a release pins it to the registry tag so
    # `docker compose pull` fetches it and `up --no-build` runs it as-is.
    image: ${APP_IMAGE:-xego-app:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Through PgBouncer (transaction pool) rather than direct to PostgreSQL.
      DATABASE_URL: postgres://whatsapp_payment:${POSTGRES_PASSWORD}@pgbouncer:6432/whatsapp_payment?sslmode=disable
      HTTP_ADDR: :8080
      # Pool and worker sizing (requirements workbook #1 and #3): 30
      # connections per replica into PgBouncer's pool of 30 server
      # connections; concurrent worker pools per class instead of one
      # sequential tick loop. Names match the workbook's section-6 env vars.
      DB_POOL_MAX: "30"
      DB_POOL_MIN: "5"
      WORKER_INBOUND_CONCURRENCY: "10"
      WORKER_OUTBOX_CONCURRENCY: "5"
      WORKER_WEBHOOK_CONCURRENCY: "4"
      WORKER_DATA_CONCURRENCY: "4"
      WORKER_RECONCILE_CONCURRENCY: "3"
      WORKER_MISC_CONCURRENCY: "3"
    deploy:
      # Phase 1 of the deployment plan: two replicas behind Caddy (compose
      # DNS round-robins the service name), each bounded so one replica
      # cannot starve the host (requirements #4 and #5). Requires Docker
      # Compose v2, which applies deploy.replicas and deploy.resources.
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "/demo", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  xego_backup:
