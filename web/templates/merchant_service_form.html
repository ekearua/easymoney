{{define "merchant_service_form.html"}}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · {{.AppName}}</title><link rel="stylesheet" href="/static/styles.css"></head>
<body>{{template "merchant_nav" .}}<main class="dashboard">
  <h1>{{if .Edit}}Edit{{else}}New{{end}} service</h1>
  <section class="panel">
    <form method="post" action="{{if .Edit}}/merchant/services/{{.Service.ID}}/edit{{else}}/merchant/services/new{{end}}">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div class="form-grid">
        <label>Service name <input name="name" value="{{if .Edit}}{{.Service.Name}}{{end}}" required></label>
        <label>Unit price (kobo) <input type="number" name="unit_price_kobo" value="{{if .Edit}}{{.Service.UnitPriceKobo}}{{end}}" min="1" required></label>
        <label>Quantity available
          <input type="number" name="quantity_available" value="{{if .Edit}}{{.Service.QuantityAvailable}}{{else}}-1{{end}}" min="-1">
          <small class="muted">-1 for unlimited</small>
        </label>
        <label>Expiry date (optional)
          <input type="date" name="expires_at" value="{{if .Edit}}{{if .Service.ExpiresAt}}{{.Service.ExpiresAt.Format "2006-01-02"}}{{end}}{{end}}">
          <small class="muted">Leave blank for no expiry</small>
        </label>
      </div>
      <label>Description
        <textarea name="description" rows="3">{{if .Edit}}{{.Service.Description}}{{end}}</textarea>
      </label>

      <hr>
      <h3>Custom fields <small class="muted">(optional – collect extra info from customers)</small></h3>
      <div id="cf-list">
        {{range $i, $f := .CustomFields}}
        <div class="cf-row">
          <input name="cf_name[]" placeholder="Field name (e.g. Seat number)" value="{{$f.FieldName}}">
          <select name="cf_type[]">
            <option value="text" {{if eq $f.FieldType "text"}}selected{{end}}>Text</option>
            <option value="number" {{if eq $f.FieldType "number"}}selected{{end}}>Number</option>
            <option value="select" {{if eq $f.FieldType "select"}}selected{{end}}>Select</option>
          </select>
          <input name="cf_options[]" placeholder="Options (comma-separated, for Select)" value="{{$f.FieldOptions}}">
          <label class="checkbox-row"><input type="checkbox" name="cf_required[]" value="1" {{if $f.IsRequired}}checked{{end}}> Required</label>
          <button type="button" class="btn-sm danger cf-remove-btn">✕</button>
        </div>
        {{end}}
      </div>
      <button type="button" class="btn-sm" id="cf-add-btn">+ Add field</button>

      <button type="submit">{{if .Edit}}Update{{else}}Create{{end}} service</button>
    </form>
  </section>
</main>
<script src="/static/merchant-services.js"></script>
</body></html>
{{end}}
