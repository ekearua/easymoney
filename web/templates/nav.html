{{define "nav"}}
<input type="checkbox" id="admin-sidebar-toggle" class="admin-sidebar-toggle-checkbox">
<label for="admin-sidebar-toggle" class="admin-sidebar-overlay"></label>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <label for="admin-sidebar-toggle" class="admin-sidebar-close" aria-label="Close menu">✕</label>
      <a class="admin-sidebar-brand" href="/admin/bulk-metrics">{{.AppName}}</a>
    </div>
    <nav class="admin-sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-header">Overview</div>
        <a class="sidebar-link{{if or (eq .Path "/admin/bulk-metrics") (eq .Path "/admin/bulk-tracking")}} active{{end}}" href="/admin/bulk-metrics">Bulk Metrics</a>
        <a class="sidebar-link{{if or (eq .Path "/admin/metrics") (eq .Path "/admin")}} active{{end}}" href="/admin/metrics">Dashboard</a>
        <a class="sidebar-link{{if eq .Path "/admin/analytics"}} active{{end}}" href="/admin/analytics">Analytics</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-header">Bulk Payments</div>
        <a class="sidebar-link{{if or (eq .Path "/admin/merchants") (eq .Path "/admin/merchants/new")}} active{{end}}" href="/admin/merchants">Merchants</a>
        <a class="sidebar-link{{if eq .Path "/admin/merchants/new"}} active{{end}}" href="/admin/merchants/new">Create merchant</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-header">Users &amp; Access</div>
        <a class="sidebar-link{{if eq .Path "/admin/users"}} active{{end}}" href="/admin/users">Users</a>
        {{if eq .AdminRole "admin"}}
        <a class="sidebar-link{{if eq .Path "/admin/admins"}} active{{end}}" href="/admin/admins">Admins</a>
        {{end}}
        <a class="sidebar-link{{if eq .Path "/admin/security"}} active{{end}}" href="/admin/security">Security</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <form method="post" action="/admin/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="link-button">Sign out</button></form>
    </div>
  </aside>
  <header class="admin-mobile-header">
    <label for="admin-sidebar-toggle" class="admin-hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <a class="admin-mobile-brand" href="/admin/bulk-metrics">{{.AppName}}</a>
  </header>
{{end}}
